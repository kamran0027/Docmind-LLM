<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --card: rgba(15, 23, 42, 0.8);
        --soft: rgba(148, 163, 184, 0.18);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #7c3aed;
        --secondary: #22d3ee;
        --danger: #f87171;
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2), #111827);
        color: var(--text);
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.45;
        z-index: 0;
      }

      body::before {
        top: -120px;
        left: -80px;
        background: rgba(124, 58, 237, 0.6);
      }

      body::after {
        right: -90px;
        bottom: -120px;
        background: rgba(34, 211, 238, 0.45);
      }

      .error-shell {
        position: relative;
        z-index: 1;
        width: min(92vw, 760px);
        background: rgba(15, 23, 42, 0.68);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 28px;
        box-shadow: 0 30px 80px var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        font-size: 12px;
        border-radius: 999px;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.25);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
      }

      .content {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 30px;
        padding: 34px 28px 38px;
      }

      .illustration {
        flex: 1 1 260px;
        display: grid;
        place-items: center;
        min-height: 250px;
      }

      .code-box {
        position: relative;
        width: 200px;
        height: 200px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.14), rgba(34, 211, 238, 0.12));
        border: 1px solid rgba(148, 163, 184, 0.18);
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
      }

      .code-box::before {
        content: "404";
        font-size: 60px;
        font-weight: 800;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.9);
      }

      .code-box::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .info {
        flex: 1 1 360px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.1;
      }

      .subtext {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }

      .row {
        background: var(--soft);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 14px;
        padding: 14px 16px;
      }

      .label {
        display: block;
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--secondary);
        margin-bottom: 8px;
      }

      .value {
        font-size: 1.03rem;
        color: var(--text);
        word-break: break-word;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), #a855f7);
        color: white;
        box-shadow: 0 14px 28px rgba(124, 58, 237, 0.38);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
      }

      .btn-secondary {
        color: var(--text);
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      @media (max-width: 640px) {
        .content {
          padding: 24px 18px 26px;
        }

        .top-bar {
          padding: 16px 18px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-shell">
      <div class="top-bar">
        <div class="badge"><span class="dot"></span> Error</div>
      </div>

      <div class="content">
        <div class="illustration">
          <div class="code-box" aria-hidden="true"></div>
        </div>

        <div class="info">
          <h1>Something went wrong</h1>
          <p class="subtext">We are sorry, but the page you requested could not be processed.</p>

          <div class="details">
            <div class="row">
              <span class="label">Message</span>
              <div class="value" th:text="${message} ?: 'Unexpected error occurred.'">Unexpected error occurred.</div>
            </div>

            <div class="row">
              <span class="label">Error</span>
              <div class="value" th:text="${error} ?: 'Unknown error'">Unknown error</div>
            </div>
          </div>

          <div class="actions">
            <a href="/dashboard" class="btn btn-primary">Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
