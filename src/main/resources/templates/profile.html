<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b1020;
            --bg-panel: rgba(17, 24, 39, 0.82);
            --bg-card: rgba(15, 23, 42, 0.9);
            --bg-soft: rgba(30, 41, 59, 0.9);
            --border-soft: rgba(148, 163, 184, 0.22);
            --text-main: #e5eefb;
            --text-muted: #a5b4cf;
            --primary: #8b5cf6;
            --primary-2: #ec4899;
            --accent: #22d3ee;
            --shadow: 0 30px 70px rgba(2, 6, 23, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.22), transparent 30%),
                radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.15), transparent 25%),
                linear-gradient(145deg, #020817 0%, #0b1120 30%, #111827 100%);
            color: var(--text-main);
        }

        .profile-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .profile-card {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid var(--border-soft);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .profile-header {
            position: relative;
            padding: 34px 32px 26px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.95) 0%, rgba(79, 70, 229, 0.9) 42%, rgba(236, 72, 153, 0.88) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .profile-header::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.18), transparent 32%);
            pointer-events: none;
        }

        .profile-header-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .profile-user {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
        }

        .profile-title {
            margin: 0;
            font-size: clamp(1.8rem, 2vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .profile-subtitle {
            margin: 6px 0 0;
            opacity: 0.9;
            font-size: 0.96rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(15, 23, 42, 0.18);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
            color: #fff;
        }

        .profile-body {
            padding: 28px 28px 32px;
            background: rgba(15, 23, 42, 0.92);
        }

        .info-panel {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.86), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--border-soft);
            border-radius: 22px;
            padding: 20px 22px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }

        .field-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .field-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(34, 211, 238, 0.12));
            color: #d7d9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.15rem;
            flex-shrink: 0;
            border: 1px solid rgba(139, 92, 246, 0.28);
        }

        .field-label {
            display: block;
            font-size: 0.74rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .field-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            line-height: 1.4;
            word-break: break-word;
        }

        @media (max-width: 576px) {
            .profile-header {
                padding: 26px 20px 20px;
            }

            .profile-header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-user {
                width: 100%;
            }

            .back-button {
                align-self: flex-start;
            }

            .profile-body {
                padding: 18px 16px 22px;
            }

            .field-row {
                gap: 12px;
                padding: 16px 4px;
            }

            .field-icon {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-shell">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-header-inner">
                    <div class="profile-user">
                        <div class="avatar" th:text="${#strings.substring(profile.name,0,1)}">U</div>
                        <div>
                            <h1 class="profile-title">Profile</h1>
                            <p class="profile-subtitle">Your personal information</p>
                        </div>
                    </div>

                    <a href="javascript:history.back()" class="back-button">Back</a>
                </div>
            </div>

            <div class="profile-body">
                <div class="info-panel">
                    <div class="field-row">
                        <div class="field-icon">N</div>
                        <div>
                            <span class="field-label">Name</span>
                            <p class="field-value" th:text="${profile.name}">John Doe</p>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field-icon">@</div>
                        <div>
                            <span class="field-label">Email</span>
                            <p class="field-value" th:text="${profile.email}">john@example.com</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
