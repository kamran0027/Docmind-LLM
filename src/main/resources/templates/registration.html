<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registration | Docmind</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			font-family: 'Inter', sans-serif;
			background: linear-gradient(135deg, #eef4ff 0%, #f8f9ff 48%, #e8f8f4 100%);
		}
		.registration-card {
			max-width: 460px;
			border: 0;
			border-radius: 24px;
			box-shadow: 0 20px 55px rgba(42, 62, 101, .13);
		}
		.brand-mark {
			width: 52px;
			height: 52px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 16px;
			color: #fff;
			font-size: 1.35rem;
			font-weight: 700;
			background: linear-gradient(135deg, #5268e8, #7b55d9);
		}
		.form-control { border-radius: 12px; padding: .78rem 1rem; }
		.form-control:focus { border-color: #6675e9; box-shadow: 0 0 0 .2rem rgba(102, 117, 233, .15); }
		.btn-register { border: 0; border-radius: 12px; padding: .8rem; font-weight: 600; background: #5268e8; }
		.btn-register:hover { background: #4057d6; }
	</style>
</head>
<body>
<main class="container d-flex align-items-center justify-content-center py-5">
	<section class="registration-card card w-100 p-4 p-sm-5">
		<div class="text-center mb-4">
			<div class="brand-mark mx-auto mb-3">D</div>
			<h1 class="h3 fw-bold mb-2">Create your account</h1>
			<p class="text-secondary mb-0">Join Docmind and keep your documents organized.</p>
		</div>

		<form th:action="@{/register}" th:object="${userRegistration}" method="post">
			<div class="mb-3">
				<label for="name" class="form-label fw-semibold">Name</label>
				<input type="text" id="name" class="form-control" th:field="*{name}"
					   placeholder="Enter your name" autocomplete="name" required>
				<div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="mb-3">
				<label for="email" class="form-label fw-semibold">Email address</label>
				<input type="email" id="email" class="form-control" th:field="*{email}"
					   placeholder="you@example.com" autocomplete="email" required>
				<div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>
			<div class="mb-4">
				<label for="password" class="form-label fw-semibold">Password</label>
				<input type="password" id="password" class="form-control" th:field="*{password}"
					   placeholder="Create a password" autocomplete="new-password" required>
				<div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<button type="submit" class="btn btn-register btn-primary w-100">Register</button>
		</form>
	</section>
</main>
</body>
</html>
